<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ball Triplets</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0ece4; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; border-radius: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 580, H = 420;
canvas.width = W; canvas.height = H;

// ── 6 triplets from the image ─────────────────────────────
// Each triplet: top ball + bottom-left + bottom-right
// Colors: R=red, G=green, P=purple
const TRIPLETS = [
  ['G','R','P'],  // top-left:   green top, red bl, purple br
  ['P','R','G'],  // top-mid:    purple top, red bl, green br
  ['R','P','G'],  // top-right:  red top, purple bl, green br
  ['P','G','R'],  // bot-left:   purple top, green bl, red br
  ['G','P','R'],  // bot-mid:    green top, purple bl, red br
  ['R','G','P'],  // bot-right:  red top, green bl, purple br
];

const COLORS = {
  R: { fill:'#c0392b', stroke:'#922b21' },
  G: { fill:'#27ae60', stroke:'#1e8449' },
  P: { fill:'#8e44ad', stroke:'#6c3483' },
};

const R = 38; // ball radius

// Grid: 3 cols x 2 rows — slot centers
function slotCenter(idx) {
  const col = idx % 3, row = Math.floor(idx / 3);
  const padX = 96, padY = 100, gapX = 192, gapY = 200;
  return [padX + col * gapX, padY + row * gapY];
}

// Triplet ball positions relative to slot center
function ballOffsets() {
  return [
    [0,       -R*1.12],   // top
    [-R*1.08,  R*0.80],   // bottom-left
    [ R*1.08,  R*0.80],   // bottom-right
  ];
}

// ── State ─────────────────────────────────────────────────
// perm[i] = which triplet is in slot i
let perm = [0,1,2,3,4,5];

// Animation
const HOLD_MS   = 900;   // pause between shuffles
const MOVE_MS   = 560;   // duration of one swap animation
let phase       = 'hold';
let phaseStart  = performance.now();
let shuffleCount = 0;
const MAX_SHUFFLES = 6;

// Current animated positions: for each slot, [x,y] on screen
let positions = Array.from({length:6}, (_,i) => [...slotCenter(i)]);
// Source / target for animation
let srcPos = null, dstPos = null;
let swapA = -1, swapB = -1;

function easeInOut(t) {
  return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
}

// Pick a random permutation of the 6 positions (Fisher-Yates)
function randomPermutation() {
  const p = [0,1,2,3,4,5];
  for (let i=5;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [p[i],p[j]]=[p[j],p[i]];
  }
  return p;
}

let nextPerm = null;
// Animate toward nextPerm by swapping one pair at a time
// We'll do full-permutation moves: animate all 6 slots simultaneously
let animSrc = null, animDst = null;

function startShuffle() {
  nextPerm = randomPermutation();
  // Source positions = current slot centers ordered by current perm
  animSrc = Array.from({length:6}, (_,i) => [...slotCenter(i)]);
  animDst = Array.from({length:6}, (_,i) => [...slotCenter(nextPerm.indexOf(i))]);
  // Actually: slot i currently holds triplet perm[i]
  // After shuffle, slot i holds triplet nextPerm[i]
  // So triplet T currently at slot perm.indexOf(T) moves to slot nextPerm.indexOf(T)
  animSrc = perm.map(t => [...slotCenter(perm.indexOf(t))]);
  // For each triplet t: src = slotCenter(current slot), dst = slotCenter(new slot)
  const newSlotOf = new Array(6);
  nextPerm.forEach((t,slot) => newSlotOf[t] = slot);
  animSrc = perm.map((t,slot) => [...slotCenter(slot)]);           // triplet at index=slot
  animDst = perm.map((t,slot) => [...slotCenter(newSlotOf[t])]);   // where it goes
  phase = 'move';
  phaseStart = performance.now();
}

// ── Draw a single ball ────────────────────────────────────
function drawBall(cx, cy, colorKey) {
  const c = COLORS[colorKey];
  // Shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.25)';
  ctx.shadowBlur  = 10;
  ctx.shadowOffsetY = 4;
  // Radial gradient for 3D look
  const grad = ctx.createRadialGradient(cx-R*0.28, cy-R*0.28, R*0.05, cx, cy, R);
  grad.addColorStop(0, lighten(c.fill, 0.5));
  grad.addColorStop(0.55, c.fill);
  grad.addColorStop(1, c.stroke);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();
  // Subtle highlight
  ctx.beginPath();
  ctx.arc(cx - R*0.28, cy - R*0.30, R*0.28, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fill();
}

function lighten(hex, amt) {
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+Math.round((255-r)*amt));
  g=Math.min(255,g+Math.round((255-g)*amt));
  b=Math.min(255,b+Math.round((255-b)*amt));
  return `rgb(${r},${g},${b})`;
}

// ── Draw a triplet at position (cx,cy) ───────────────────
function drawTriplet(cx, cy, colors) {
  const offs = ballOffsets();
  // Draw back balls first (bottom two), then top
  [1,2,0].forEach(i => drawBall(cx+offs[i][0], cy+offs[i][1], colors[i]));
}

// ── Background ────────────────────────────────────────────
function drawBackground() {
  ctx.fillStyle = '#ede8df';
  ctx.fillRect(0,0,W,H);
  // subtle grid dots
  ctx.fillStyle = 'rgba(180,170,155,0.35)';
  for (let x=24;x<W;x+=28) for (let y=24;y<H;y+=28) {
    ctx.beginPath(); ctx.arc(x,y,1.2,0,Math.PI*2); ctx.fill();
  }
}

// ── Main loop ─────────────────────────────────────────────
function loop(now) {
  requestAnimationFrame(loop);
  const elapsed = now - phaseStart;

  if (phase === 'hold') {
    if (elapsed > HOLD_MS && shuffleCount < MAX_SHUFFLES) {
      startShuffle();
    }
    // draw static
    drawBackground();
    perm.forEach((t, slot) => {
      const [cx,cy] = slotCenter(slot);
      drawTriplet(cx, cy, TRIPLETS[t]);
    });

  } else if (phase === 'move') {
    const t = Math.min(1, elapsed / MOVE_MS);
    const e = easeInOut(t);

    drawBackground();

    // Draw each triplet at interpolated position
    perm.forEach((tripletIdx, slotIdx) => {
      const sx=animSrc[slotIdx][0], sy=animSrc[slotIdx][1];
      const dx=animDst[slotIdx][0], dy=animDst[slotIdx][1];
      const cx = sx + (dx-sx)*e;
      const cy = sy + (dy-sy)*e;
      drawTriplet(cx, cy, TRIPLETS[tripletIdx]);
    });

    if (t >= 1) {
      perm = [...nextPerm];
      shuffleCount++;
      phase = 'hold';
      phaseStart = now;
    }
  }
}

requestAnimationFrame(loop);
</script>
</body>
</html>
